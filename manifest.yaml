name: universal-menu
version: 0.3.0
description: Universal Telegram menu system for Hermes agents
category: productivity

commands:
  - name: menu
    description: Show/hide the universal menu
  - name: services
    description: Manage connected services
  - name: install
    description: Install a skill from GitHub
    args:
      - name: url
        type: string
        required: true
  - name: update
    description: Update an installed skill
    args:
      - name: name
        type: string
        required: true

# Runtime handlers are registered through the Python plugin API.
# Do not declare legacy hooks here: the compatible Hermes branch validates
# hook names and would load these as unrelated legacy callbacks.

toolsets:
  - terminal
  - file
  - skills
