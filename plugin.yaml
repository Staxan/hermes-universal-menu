name: universal-menu
label: Universal Menu
kind: standalone
version: 0.3.0
category: productivity
description: >
  Profile-local Telegram menu with service settings and a bridge to Hermes
  built-in model picker. The plugin is opt-in and does not patch Hermes files.
author: Staxan
portable: false
requires_env: []
provides_hooks: []
provides_tools: []

# The plugin uses ctx.register_telegram_handler available in the compatible
# Hermes branch feat/universal-menu-telegram.
# It remains inactive until explicitly enabled with `hermes plugins enable`.
